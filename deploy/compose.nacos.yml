# Standalone learning environment with embedded Derby storage.
name: smarthotel-cloud-nacos
services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Missing NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Missing NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Missing NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_BIND_ADDRESS:?Set the Ubuntu IPv4 address}:8088:8080"
      - "${NACOS_BIND_ADDRESS:?Set the Ubuntu IPv4 address}:8848:8848"
      - "${NACOS_BIND_ADDRESS:?Set the Ubuntu IPv4 address}:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
volumes:
  nacos-data:
  nacos-logs:
