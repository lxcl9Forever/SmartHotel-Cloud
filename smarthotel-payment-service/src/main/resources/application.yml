server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8087}
  forward-headers-strategy: none
spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: smarthotel-payment-service
  datasource:
    hikari:
      # DATETIME defaults and SQL NOW()/CURDATE() use the hotel business timezone.
      maximum-pool-size: 6
      minimum-idle: 1
      connection-init-sql: "SET time_zone = '+08:00'"
    url: ${PAYMENT_MYSQL_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/smart_hotel_payment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}}
    username: ${PAYMENT_MYSQL_USER:${MYSQL_USER:sh_payment_app}}
    password: ${PAYMENT_MYSQL_PASSWORD:${MYSQL_PASSWORD}}
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        auto-startup: ${RABBITMQ_ENABLED:false}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 3000
          userDirectory:
            connectTimeout: 1500
            readTimeout: 3000
            loggerLevel: none
          smarthotel-user-service:
            connectTimeout: 1500
            readTimeout: 3000
            loggerLevel: none
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
smarthotel:
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
  inventory:
    mode: ${INVENTORY_MODE:remote}
  internal:
    token: ${INTERNAL_TOKEN}
  services:
    hotel-url: ${HOTEL_SERVICE_URL:http://127.0.0.1:8083}
    inventory-url: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8084}
    order-url: ${ORDER_SERVICE_URL:http://127.0.0.1:8082}
    user-url: ${USER_SERVICE_URL:http://127.0.0.1:8081}
  order:
    payment-timeout-minutes: 30
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    app-id: ${ALIPAY_APP_ID:}
    private-key-file: ${ALIPAY_PRIVATE_KEY_FILE:}
    public-key-file: ${ALIPAY_PUBLIC_KEY_FILE:}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    seller-id: ${ALIPAY_SELLER_ID:}
  ai:
    llm-enabled: ${AI_LLM_ENABLED:false}
    llm-url: ${AI_LLM_URL:https://api.deepseek.com/chat/completions}
    llm-model: ${AI_LLM_MODEL:deepseek-flash}
    llm-api-key: ${AI_LLM_API_KEY:}

# SDK error logs otherwise include full signed payment requests and channel payloads.
logging:
  level:
    sdk: "OFF"
