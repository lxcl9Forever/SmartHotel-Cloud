server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
spring:
  application:
    name: smarthotel-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
smarthotel:
  internal:
    token: ${INTERNAL_TOKEN}
  services:
    user-uri: ${USER_SERVICE_URI:http://127.0.0.1:8081}
    business-uri: ${BUSINESS_SERVICE_URI:http://127.0.0.1:8082}

    hotel-uri: ${HOTEL_SERVICE_URI:http://127.0.0.1:8083}
