server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
spring:
  application:
    name: smarthotel-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
smarthotel:
  internal:
    token: ${INTERNAL_TOKEN}
  services:
    user-uri: ${USER_SERVICE_URI:http://127.0.0.1:8081}
    order-uri: ${ORDER_SERVICE_URI:http://127.0.0.1:8082}
    hotel-uri: ${HOTEL_SERVICE_URI:http://127.0.0.1:8083}
    review-uri: ${REVIEW_SERVICE_URI:http://127.0.0.1:8085}
    marketing-uri: ${MARKETING_SERVICE_URI:http://127.0.0.1:8086}
    payment-uri: ${PAYMENT_SERVICE_URI:http://127.0.0.1:8087}
    stay-uri: ${STAY_SERVICE_URI:http://127.0.0.1:8089}
    statistics-uri: ${STATISTICS_SERVICE_URI:http://127.0.0.1:8090}
