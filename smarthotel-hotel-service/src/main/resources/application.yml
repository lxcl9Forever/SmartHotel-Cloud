server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: smarthotel-hotel-service
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      read-only: false
      connection-init-sql: "SET time_zone = '+08:00'"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health

smarthotel:
  services:
    inventory-url: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8084}
  internal:
    token: ${INTERNAL_TOKEN}
